name: Run API Tests

on:
  workflow_dispatch:
    inputs:
      deployment_target:
        description: Choose target
        required: true
        type: choice
        default: all
        options:
          - all
         
permissions:
  contents: read
  pages: write
  id-token: write
  
jobs:
  run-tests:
    runs-on: ubuntu-latest
    name: Tests
    outputs:
      good: ${{ steps.all.outcome }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python env
        uses: actions/setup-python@v5
        with:
          python-version: "3.15.2"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run API tests and generate Allure results
        id: all
        run: |
          pytest -m all --alluredir=allure-results --numprocesses 2
        continue-on-error: true
      - uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'
      - run: sudo wget https://github.com/allure-framework/allure2/releases/download/2.46.2/allure-2.46.2.tgz && sudo tar -zxvf allure-2.46.2.tgz -C /opt/ && sudo ln -s /opt/allure-2.46.2/bin/allure /usr/bin/allure
      - run: allure generate -c allure-results -o allure-report
      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          retention-days: 1
      # - name: Upload Allure results
      #   if: always()
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: allure-results
      #     path: allure-results

  publish-report:
      if: always()
      needs: run-tests
      runs-on: ubuntu-latest
      name: Report publication
      steps:
        - name: Check out repository (gh-pages)
          uses: actions/checkout@v4
  
        - name: Download Allure results
          uses: actions/download-artifact@v4
          with:
            name: allure-results
            path: allure-results
  
        - name: Generate Allure Report
          uses: simple-elf/allure-report-action@v1.12
          with:
            allure_results: allure-results
            allure_history: allure-history
  
        # - name: Deploy report to GitHub Pages
