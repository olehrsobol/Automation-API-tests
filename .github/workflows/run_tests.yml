name: Run API Tests

on:
  workflow_dispatch:
    inputs:
      deployment_target:
        description: Select tests to run
        required: true
        type: choice
        default: all
        options:
          - all
          
permissions:
  contents: read
  pages: write
  id-token: write
  
jobs:
  run-tests:
    runs-on: ubuntu-latest
    name: Tests
    steps:
      - name: Copy source code
        uses: actions/checkout@v4
      - name: Set up Python env
        uses: actions/setup-python@v5
        with:
          python-version: "3.15.2"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run API tests and generate Allure results
        run: |
          pytest -m regression --alluredir=allure-results --numprocesses 2
            # -m regression: запуск тестов с меткой regression
            # --alluredir: сохранение результатов в формате Allure
            # --numprocesses: параллельный запуск для ускорения
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          
  publish-report:
      if: always()
      needs: [ run-tests ]
      runs-on: ubuntu-latest
      steps:
        - name: Check out repository (gh-pages)
          uses: actions/checkout@v4
          with:
            ref: gh-pages
            path: gh-pages
  
        - name: Download Allure results
          uses: actions/download-artifact@v4
          with:
            name: allure-results
            path: allure-results
  
        - name: Generate Allure Report
          uses: simple-elf/allure-report-action@v1.12
          with:
            allure_results: allure-results
            allure_history: allure-history
  
        - name: Deploy report to GitHub Pages
          uses: peaceiris/actions-gh-pages@v4
          with:
            github_token: ${{ secrets.GITHUB_TOKEN }}
            publish_branch: gh-pages
            publish_dir: allure-history
